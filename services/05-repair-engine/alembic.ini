# Alembic config -- Service 05 Repair Engine
# NOTE: keep this file ASCII-only. Alembic reads it with configparser using the
# system locale encoding (cp949 on Korean Windows), so non-ASCII text breaks it.
# sqlalchemy.url is intentionally absent: migrations/env.py reads DATABASE_URL
# from .env via app.config, so SQLite (PoC) and PostgreSQL share one command.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
